title: varioproger Reference
description: 참고 자료 모음
theme: just-the-docs
lang: ko

url: https://varioproger.github.io

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# doc 하위 문서는 사이드바/검색에서 제외하고 URL 로만 접근한다
# 문서 본문의 {{ }} / {% %} 가 Liquid 로 해석되지 않도록 한다
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "doc"
    values:
      nav_exclude: true
      search_exclude: true
      render_with_liquid: false

nav_sort: case_sensitive
back_to_top: true
back_to_top_text: "맨 위로"
search_enabled: true
